<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TXTUR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ECECEA;
      color: #151515;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .page {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 55px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      padding-bottom: 55px;
    }

    .logo {
      margin: 0 0 18px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 300;
      letter-spacing: 0.38em;
      line-height: 1;
    }

    .logo-x {
      font-weight: 800;
    }

    .radio-names {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: #555;
    }


    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      margin: 0;
      padding: 0 0 18px;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #555;
    }


    /* =========================
       MIXES
    ========================= */

    .list {
      border-top: 1px solid #b8b8b5;
    }

    .item {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      min-height: 155px;
      border-bottom: 1px solid #b8b8b5;
      text-decoration: none;
      color: inherit;
    }

    .item-image {
      width: 180px;
      height: 155px;
      object-fit: cover;
      display: block;
    }

    .item-info {
      padding: 30px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .item-title {
      margin: 0 0 10px;
      font-family: Rockwell, "Roboto Slab", Georgia, serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.1;
    }

    .item-subtitle {
      margin: 0 0 14px;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      color: #555;
      letter-spacing: 0.02em;
    }

    .item-platform {
      margin: 0;
      font-family: Rockwell, "Roboto Slab", Georgia, serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .item-action {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-right: 18px;
      white-space: nowrap;
    }

    .play-now {
      font-family: "Courier New", Courier, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #555;
    }

    .arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-family: Arial, sans-serif;
      font-weight: 300;
    }

    .item:hover,
    .platform:hover {
      background: rgba(0, 0, 0, 0.025);
    }


    /* =========================
       PLATEFORMES
    ========================= */

    .platform-section {
      margin-top: 55px;
    }

    .platforms {
      border-top: 1px solid #b8b8b5;
      border-bottom: 1px solid #b8b8b5;
    }

    .platform {
      min-height: 135px;
      display: grid;
      grid-template-columns: 180px 1fr 55px;
      border-bottom: 1px solid #b8b8b5;
      text-decoration: none;
      color: inherit;
    }

    .platform:last-child {
      border-bottom: none;
    }

    .platform-image {
      width: 180px;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    .platform-info {
      padding: 25px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .platform-subtitle {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      color: #555;
      letter-spacing: 0.02em;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      padding-top: 45px;
    }

    .copyright {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .page {
        width: calc(100% - 24px);
        padding-top: 45px;
      }

      .logo {
        font-size: 27px;
        letter-spacing: 0.32em;
      }

      .radio-names {
        font-size: 10px;
        letter-spacing: 0.10em;
      }

      .section-title {
        font-size: 10px;
      }

      .item {
        grid-template-columns: 105px 1fr auto;
        min-height: 105px;
      }

      .item-image {
        width: 105px;
        height: 105px;
      }

      .item-info {
        padding: 18px 15px;
      }

      .item-title {
        font-size: 15px;
      }

      .item-subtitle {
        font-size: 10px;
      }

      .item-platform {
        font-size: 9px;
      }

      .item-action {
        gap: 5px;
        padding-right: 8px;
      }

      .play-now {
        font-size: 7px;
      }

      .arrow {
        font-size: 20px;
      }

      .platform-section {
        margin-top: 40px;
      }

      .platform {
        grid-template-columns: 105px 1fr 38px;
        min-height: 105px;
      }

      .platform-image {
        width: 105px;
        height: 105px;
      }

      .platform-info {
        padding: 18px 15px;
      }

      .platform-subtitle {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="page">


    <!-- HEADER -->

    <header>

      <h1 class="logo">
        T <span class="logo-x">X</span> T U R
      </h1>

      <p class="radio-names">
        House &amp; Techno radio
      </p>

    </header>


    <!-- RECENT MIXES -->

    <section class="mix-section">

      <h2 class="section-title">
        RECENT MIXES
      </h2>

      <div class="list">


        <!-- TMR_001 -->

        <a
          class="item"
          href="https://youtu.be/zc9zYC2cApA?si=NTfoKWc4qhNejgla"
          target="_blank"
          rel="noopener noreferrer">

          <img
            class="item-image"
            src="TMR_001 1x1.PNG"
            alt="TMR_001">

          <div class="item-info">

            <h3 class="item-title">
              TMR_001
            </h3>

            <p class="item-subtitle">
              Techno Mixtur Radio
            </p>

            <p class="item-platform">
              YOUTUBE
            </p>

          </div>

          <div class="item-action">

            <span class="play-now">
              PLAY NOW
            </span>

            <span class="arrow">
              →
            </span>

          </div>

        </a>


        <!-- HMR_001 -->

        <a
          class="item"
          href="https://soundcloud.com/txturmusic/hmr_001?in=txturmusic/sets/house-mixtur-radio"
          target="_blank"
          rel="noopener noreferrer">

          <img
            class="item-image"
            src="HMR_001 1x1.png"
            alt="HMR_001">

          <div class="item-info">

            <h3 class="item-title">
              HMR_001
            </h3>

            <p class="item-subtitle">
              House Mixtur Radio
            </p>

            <p class="item-platform">
              SOUNDCLOUD
            </p>

          </div>

          <div class="item-action">

            <span class="play-now">
              PLAY NOW
            </span>

            <span class="arrow">
              →
            </span>

          </div>

        </a>

      </div>

    </section>


    <!-- PLATEFORMES -->

    <section class="platform-section">

      <h2 class="section-title">
        CONNECT
      </h2>

      <nav class="platforms">


        <!-- SOUNDCLOUD -->

        <a
          class="platform"
          href="https://soundcloud.com/txturmusic"
          target="_blank"
          rel="noopener noreferrer">

          <img
            class="platform-image"
            src="soundcloud.png"
            alt="SoundCloud">

          <div class="platform-info">

            <p class="platform-subtitle">
              txturmusic
            </p>

          </div>

          <div class="arrow">
            →
          </div>

        </a>


        <!-- YOUTUBE -->

        <a
          class="platform"
          href="https://www.youtube.com/@txtur_music"
          target="_blank"
          rel="noopener noreferrer">

          <img
            class="platform-image"
            src="youtube.png"
            alt="YouTube">

          <div class="platform-info">

            <p class="platform-subtitle">
              txtur_music
            </p>

          </div>

          <div class="arrow">
            →
          </div>

        </a>


        <!-- INSTAGRAM -->

        <a
          class="platform"
          href="https://www.instagram.com/hi.txtur/"
          target="_blank"
          rel="noopener noreferrer">

          <img
            class="platform-image"
            src="insta.png"
            alt="Instagram">

          <div class="platform-info">

            <p class="platform-subtitle">
              @hi.txtur
            </p>

          </div>

          <div class="arrow">
            →
          </div>

        </a>


        <!-- TIKTOK -->

        <a
          class="platform"
          href="https://www.tiktok.com/@txtur.music"
          target="_blank"
          rel="noopener noreferrer">

          <img
            class="platform-image"
            src="tik tok.png"
            alt="TikTok">

          <div class="platform-info">

            <p class="platform-subtitle">
              @txtur.music
            </p>

          </div>

          <div class="arrow">
            →
          </div>

        </a>

      </nav>

    </section>


    <!-- FOOTER -->

    <footer>

      <p class="copyright">
        TXTUR ©
      </p>

    </footer>


  </main>

</body>
</html>
