<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TXTUR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ECECEA;
      color: #151515;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
    }

    .page {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 55px;
    }

    header {
      text-align: center;
      padding-bottom: 55px;
    }

.logo {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 34px;
    font-weight: 300;
    letter-spacing: 0.38em;
}

.logo-x {
    font-weight: 800;
}

    .radio-names {
      margin: 18px 0 0;
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: 0.18em;
      color: #555;
    }

    /* MIXES */

    .list {
      border-top: 1px solid #b8b8b5;
    }

    .item {
      display: grid;
      grid-template-columns: 180px 1fr 55px;
      min-height: 155px;
      border-bottom: 1px solid #b8b8b5;
      text-decoration: none;
      color: inherit;
    }

    .item-image {
      width: 180px;
      height: 155px;
      object-fit: cover;
      display: block;
    }

    .item-info {
      padding: 30px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .item-title {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .item-subtitle {
      margin: 0 0 14px;
      font-size: 12px;
      color: #555;
    }

    .item-platform {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-family: Arial, sans-serif;
      font-weight: 300;
    }

    .item:hover,
    .platform:hover {
      background: rgba(0, 0, 0, 0.025);
    }

    /* PLATEFORMES */

    .platforms {
      border-bottom: 1px solid #b8b8b5;
    }

    .platform {
      min-height: 135px;
      display: grid;
      grid-template-columns: 180px 1fr 55px;
      border-bottom: 1px solid #b8b8b5;
      text-decoration: none;
      color: inherit;
    }

    .platform:last-child {
      border-bottom: none;
    }

    .platform-image {
      width: 180px;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    .platform-info {
      padding: 25px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .platform-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .platform-subtitle {
      margin: 0;
      font-size: 11px;
      color: #555;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding-top: 45px;
    }

    .copyright {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page {
        width: calc(100% - 24px);
        padding-top: 45px;
      }

      .logo {
        font-size: 27px;
      }

      .radio-names {
        font-size: 10px;
      }

      .item,
      .platform {
        grid-template-columns: 105px 1fr 38px;
        min-height: 105px;
      }

      .item-image,
      .platform-image {
        width: 105px;
        height: 105px;
      }

      .item-info,
      .platform-info {
        padding: 18px 15px;
      }

      .item-title {
        font-size: 15px;
      }

      .item-subtitle {
        font-size: 10px;
      }

      .item-platform {
        font-size: 9px;
      }

      .platform-title {
        font-size: 14px;
      }

      .platform-subtitle {
        font-size: 9px;
      }

      .arrow {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- HEADER -->

    <header>
      <h1 class="logo">T X T U R</h1>

      <p class="radio-names">
        TECHNO MIXTUR RADIO<br>
        HOUSE MIXTUR RADIO
      </p>
    </header>


    <!-- MIXES -->

    <section class="list">

      <!-- TMR_001 -->

      <a
        class="item"
        href="https://www.youtube.com/watch?v=zc9zYC2cApA"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="item-image"
          src="TMR_001 1x1.PNG"
          alt="TMR_001">

        <div class="item-info">
          <h2 class="item-title">TMR_001</h2>
          <p class="item-subtitle">Techno Mixtur Radio</p>
          <p class="item-platform">YOUTUBE</p>
        </div>

        <div class="arrow">→</div>

      </a>


      <!-- HMR_001 -->

      <a
        class="item"
        href="https://www.youtube.com/@txtur_music"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="item-image"
          src="HMR_001 1x1.PNG"
          alt="HMR_001">

        <div class="item-info">
          <h2 class="item-title">HMR_001</h2>
          <p class="item-subtitle">House Mixtur Radio</p>
          <p class="item-platform">YOUTUBE</p>
        </div>

        <div class="arrow">→</div>

      </a>

    </section>


    <!-- PLATEFORMES -->

    <nav class="platforms">


      <!-- SOUNDCLOUD -->

      <a
        class="platform"
        href="https://soundcloud.com/txturmusic"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="platform-image"
          src="soundcloud.png"
          alt="soundcloud">

        <div class="platform-info">
          <h2 class="platform-title">SOUNDCLOUD</h2>
          <p class="platform-subtitle">TXTUR</p>
        </div>

        <div class="arrow">→</div>

      </a>


      <!-- YOUTUBE -->

      <a
        class="platform"
        href="https://www.youtube.com/@txtur_music"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="platform-image"
          src="youtube.png"
          alt="youtube">

        <div class="platform-info">
          <h2 class="platform-title">YOUTUBE</h2>
          <p class="platform-subtitle">TXTUR</p>
        </div>

        <div class="arrow">→</div>

      </a>


      <!-- INSTAGRAM -->

      <a
        class="platform"
        href="https://www.instagram.com/txtur_music/"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="platform-image"
          src="insta.png"
          alt="instagram">

        <div class="platform-info">
          <h2 class="platform-title">INSTAGRAM</h2>
          <p class="platform-subtitle">@txtur_music</p>
        </div>

        <div class="arrow">→</div>

      </a>


      <!-- TIKTOK -->

      <a
        class="platform"
        href="https://www.tiktok.com/@txtur_music"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="platform-image"
          src="tiktok.png"
          alt="tiktok">

        <div class="platform-info">
          <h2 class="platform-title">TIKTOK</h2>
          <p class="platform-subtitle">@txtur_music</p>
        </div>

        <div class="arrow">→</div>

      </a>

    </nav>


    <!-- FOOTER -->

    <footer>
      <p class="copyright">TXTUR ©</p>
    </footer>

  </main>

</body>
</html>
